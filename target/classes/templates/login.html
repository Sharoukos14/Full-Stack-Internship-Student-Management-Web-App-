<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #00B3FF;
            color: white;
            padding:1rem;
            display: flex;
            justify-content: space-between;
            
		   
		   
        }
        
        .navbar-right {
			display: flex;
		    align-items: center;
		    gap: 1rem;
		}
        .navbar-left {
			display: flex;
		    align-items: center;
		    gap: 1rem;
		}
		

		.register-button {
		  	background-color: #80A0FF;
		    color: white;
		   	border: none;
		 	padding: 0.5rem 1rem;
			border-radius: 5px;
		    cursor: pointer;
		}
		
        
        .button {
		  	background-color: #99CCFF;
		    color: white;
		   	border: none;
		 	padding: 0.2rem 1rem;
			border-radius: 5px;
		    cursor: pointer;
		}
        
		.button:hover {
			background-color: #777;
		}
    </style>
</head>
<body>
	<div class="navbar">
      		
       	<div class = "navbar-left">
            <form th:action="@{/login}" method="post">
            	<p>Login   <input type="text" name="username" placeholder="Username" required />
                <input type="password" name="password" placeholder="Password" required />
                <button type="submit" class="button">Login</button></p>
                
            </form>
		</div>
            <div class = navbar-right>
            	<form th:action="@{/register}" method="get">
					<button type="submit" class="register-button">Register</button>
				</form>
            	
            
        </div>
    </div>
	<img th:src="@{/uoi-logo.png}" style="width: 100%; height: auto;" />

</body>
</html>
