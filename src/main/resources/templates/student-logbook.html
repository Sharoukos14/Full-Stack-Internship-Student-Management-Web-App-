<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{student :: head}"></head>
<body>
	
	<div th:replace="~{student :: content}">
		
		
	</div>
	<h2>Your Logbook:</h2>
	<div>
	    <th:block th:each="p : ${logbook}">
	        <h3 th:utext="${p}">\n</h3> 
	    </th:block>
	</div>
	
	<form th:action="@{/student/logbook/add}" method="get">
			<button type="submit" class = "button" style="position: absolute; right: 330px; top:17px;"   >Add To Logbook</button>
	</form>
	
	<img th:src="@{/uoi-logo.png}" style="width: 100%; height: auto;" />
</body>
</html>
