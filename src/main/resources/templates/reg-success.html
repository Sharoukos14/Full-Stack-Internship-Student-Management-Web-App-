<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Successful</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #00B3FF;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .navbar-left, .navbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .button {
            background-color: #99CCFF;
            color: white;
            border: none;
            padding: 0.2rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #777;
        }

        .content {
            text-align: center;
            padding: 3rem;
        }

        .success-message {
            font-size: 1.5rem;
            color: #00B3FF;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <form th:action="@{/login}" method="get">
                <button type="submit" class="button">Go to Login</button>
            </form>
        </div>
        <div class="navbar-right">
            <form th:action="@{/register}" method="get">
                <button type="submit" class="button">Register Again</button>
            </form>
        </div>
    </div>

    <div class="content">
        <h1 class="success-message">Η εγγραφή ολοκληρώθηκε!</h1>
        
    </div>
</body>
</html>
